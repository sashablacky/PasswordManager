name: Build macOS app

# Builds "Password Manager.app" for Apple Silicon and Intel Macs, packed in a
# .dmg, and keeps it as a downloadable artifact of the run (Actions tab ->
# the run -> Artifacts). Runs on every push to main and by hand.
#
# A pushed version tag (v1.4.1, ...) also publishes a GitHub Release with both
# .dmg files, downloadable without a GitHub account:
#     git tag v1.4.1 && git push origin v1.4.1
# The tag must match src/version.py. "What's new" for the release page is read
# from docs/releases/<tag>.md if that file exists.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon (M1 and later)
            arch: arm64
            kind: AppleSilicon
          - runner: macos-15-intel    # Intel Macs
            arch: x86_64
            kind: Intel

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/macos/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/macos/requirements-build.txt
          python -c "import platform, PyQt5.QtCore as q; print(platform.machine(), 'Qt', q.QT_VERSION_STR)"

      # The Fluent window frame calls into the native Cocoa window, which the
      # offscreen Qt platform does not have, so all tests run on the runner's
      # real window system. The offscreen run covers the rest (the window tests
      # skip themselves there).
      - name: Tests (offscreen, without the Fluent window tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      # On failure the end of the log (with the faulthandler traceback of a crash)
      # is also shown as an annotation of the run, readable without the raw logs
      - name: Tests (all, native window system)
        run: |
          set -o pipefail
          if ! python -X faulthandler -m pytest -v -p no:cacheprovider tests 2>&1 | tee pytest-native.log; then
            tail -n 80 pytest-native.log | python -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::error title=Native tests failed::' + t)"
            exit 1
          fi

      - name: Build app and dmg
        run: ./packaging/macos/build_macos.sh --skip-install --skip-tests

      - name: Check the bundle
        run: |
          APP="dist/Password Manager.app"
          plutil -p "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/Password Manager"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Start the app for a few seconds: it must not crash on start-up
          "$APP/Contents/MacOS/Password Manager" &
          PID=$!
          sleep 15
          if ! kill -0 $PID 2>/dev/null; then
            echo "The app exited during start-up"; wait $PID; exit 1
          fi
          kill $PID

      - uses: actions/upload-artifact@v7
        with:
          name: PasswordManager-macOS-${{ matrix.kind }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: PasswordManager-macOS-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/version.py)"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG does not match src/version.py ($VERSION)"
            exit 1
          fi
          ls -l dist
          test -f "dist/PasswordManager-$VERSION-macOS-AppleSilicon.dmg"
          test -f "dist/PasswordManager-$VERSION-macOS-Intel.dmg"

          {
            if [[ -f "docs/releases/$TAG.md" ]]; then
              cat "docs/releases/$TAG.md"
              echo
            fi
            sed "s/{VERSION}/$VERSION/g" docs/releases/download-help.md
          } > release-notes.md

          gh release create "$TAG" dist/*.dmg \
            --title "Password Manager $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
