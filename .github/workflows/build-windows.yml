name: Build Windows app

# Builds the program for Windows (an installer and a portable .zip) and keeps
# them as downloadable artifacts of the run (Actions tab -> the run ->
# Artifacts). Runs on every push to main and by hand.
#
# The macOS version is frozen on the macos-stable branch (cut from v1.5.5),
# which has its own workflow; main builds no .dmg.
#
# A pushed version tag (v1.6.0, ...) also publishes a GitHub Release with the
# files, downloadable without a GitHub account:
#     git tag v1.6.0 && git push origin v1.6.0
# The tag must match src/version.py. "What's new" for the release page is read
# from docs/releases/<tag>.md if that file exists.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NEEDS_REAL_WINDOW: tests/test_browser_bridge_ui.py::test_unlock_from_browser_opens_the_vault
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/windows/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/windows/requirements-build.txt

      - name: Tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          if ! python -m pytest -q -rfE --tb=short -p no:cacheprovider tests \
              --deselect "$NEEDS_REAL_WINDOW" 2>&1 | tee pytest-windows.log; then
            python .github/scripts/annotate_failure.py "Windows tests failed" < pytest-windows.log
            exit 1
          fi

      # Minimizing a Fluent window asks Windows about its handle (GetWindowPlacement);
      # the offscreen platform has no real handle, so this test needs the runner's desktop
      - name: Tests (real window)
        env:
          QT_QPA_PLATFORM: windows
        run: |
          set -o pipefail
          if ! python -m pytest -q -rfE --tb=short -p no:cacheprovider "$NEEDS_REAL_WINDOW" 2>&1 | tee pytest-window.log; then
            python .github/scripts/annotate_failure.py "Windows window test failed" < pytest-window.log
            exit 1
          fi

      - name: Build the program
        run: |
          set -o pipefail
          if ! python -m PyInstaller --noconfirm --clean packaging/windows/PasswordManager.spec 2>&1 | tee build.log; then
            python .github/scripts/annotate_failure.py "Windows build failed" < build.log
            exit 1
          fi
          echo "VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/version.py)" >> "$GITHUB_ENV"

      # On the runner's real desktop (not offscreen); data in a temporary folder
      - name: Start the program
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "appdata-portable"
          New-Item -ItemType Directory -Force $data | Out-Null
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "dist/Password Manager/Password Manager.exe").Path
          $psi.UseShellExecute = $false
          $psi.EnvironmentVariables["APPDATA"] = $data
          $p = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 20
          $p.Refresh()
          $log = Join-Path $data "SecureVault/error.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.HasExited) { Write-Output "::error title=Windows start::the program exited (code $($p.ExitCode))"; exit 1 }
          Write-Output "Running, window title: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
          if ((Test-Path $log) -and (Get-Item $log).Length -gt 0) { Write-Output "::error title=Windows start::error.log is not empty"; exit 1 }

      - name: Portable .zip
        run: |
          cd dist
          7z a -tzip "PasswordManager-$VERSION-Windows-Portable.zip" "Password Manager" > /dev/null
          ls -l *.zip

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$((Resolve-Path 'dist/Password Manager').Path)" "/DOutputDir=$((Resolve-Path 'dist').Path)" packaging/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist/*.exe

      # Silent install for the current user, start, uninstall: the program and
      # its Firefox host registration go, the user's data in %APPDATA%\SecureVault stays
      - name: Check the installer
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist/PasswordManager-$env:VERSION-Windows-Setup.exe").Path
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "Programs/Password Manager"
          $exe = Join-Path $dir "Password Manager.exe"
          if (-not (Test-Path $exe)) { Write-Output "::error title=Installer::$exe was not installed"; exit 1 }
          $shortcut = Join-Path $env:APPDATA "Microsoft/Windows/Start Menu/Programs/Password Manager.lnk"
          if (-not (Test-Path $shortcut)) { Write-Output "::error title=Installer::no Start menu shortcut"; exit 1 }
          python .github/scripts/check_native_host.py $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Output "::error title=Installer::the installed program exited"; exit 1 }
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          $vault = Join-Path $env:APPDATA "SecureVault/password_vault.db"
          if (-not (Test-Path $vault)) { Write-Output "::error title=Installer::the program created no vault"; exit 1 }
          Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { Write-Output "::error title=Installer::the uninstaller left the program"; exit 1 }
          if (-not (Test-Path $vault)) { Write-Output "::error title=Installer::the uninstaller deleted the user's vault"; exit 1 }
          python .github/scripts/check_native_host.py $dir --removed
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Output "Installed, started, uninstalled; the vault was kept"

      - uses: actions/upload-artifact@v7
        with:
          name: PasswordManager-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # The Firefox extension as an .xpi with the program's version. Ordinary Firefox
  # installs only extensions signed by Mozilla: for a version tag it is signed on
  # addons.mozilla.org as "unlisted" (not published in the catalogue) and goes into
  # the release. That needs the repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET
  # (https://addons.mozilla.org/developers/addon/api/key/); without them, and on
  # other runs, only an unsigned .xpi is kept as an artifact, for Firefox Developer
  # Edition with xpinstall.signatures.required = false.
  firefox-extension:
    name: Firefox extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Lint
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/version.py)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p build
          cp -r browser-extension/extension build/firefox-extension
          node -e '
            const fs = require("fs"), p = "build/firefox-extension/manifest.json";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            m.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(m, null, 2));'
          npx --yes web-ext@8 lint --source-dir build/firefox-extension --warnings-as-errors

      - name: Unsigned .xpi
        run: |
          npx --yes web-ext@8 build --source-dir build/firefox-extension --artifacts-dir build/xpi --overwrite-dest
          mkdir -p dist
          mv build/xpi/*.zip "dist/SecureVault-$VERSION-Firefox-unsigned.xpi"

      - name: Signed .xpi
        if: startsWith(github.ref, 'refs/tags/v') && env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx --yes web-ext@8 sign --channel=unlisted --source-dir build/firefox-extension \
            --artifacts-dir build/signed --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv build/signed/*.xpi "dist/PasswordManager-$VERSION-Firefox.xpi"

      - name: No signing key
        if: startsWith(github.ref, 'refs/tags/v') && (env.AMO_JWT_ISSUER == '' || env.AMO_JWT_SECRET == '')
        run: echo "::warning title=Firefox extension::AMO_JWT_ISSUER/AMO_JWT_SECRET are not set, the release gets no signed .xpi"

      - uses: actions/upload-artifact@v7
        with:
          name: Firefox-extension-unsigned
          path: dist/*-unsigned.xpi
          retention-days: 30

      # Named like the program's artifacts, so the release picks it up
      - uses: actions/upload-artifact@v7
        with:
          name: PasswordManager-Firefox
          path: dist/PasswordManager-*-Firefox.xpi
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, firefox-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: PasswordManager-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/version.py)"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::Tag $TAG does not match src/version.py ($VERSION)"
            exit 1
          fi
          ls -l dist
          test -f "dist/PasswordManager-$VERSION-Windows-Setup.exe"
          test -f "dist/PasswordManager-$VERSION-Windows-Portable.zip"

          {
            if [[ -f "docs/releases/$TAG.md" ]]; then
              cat "docs/releases/$TAG.md"
              echo
            fi
            sed "s/{VERSION}/$VERSION/g" docs/releases/download-help.md
          } > release-notes.md

          gh release create "$TAG" dist/*.exe dist/*.zip $(ls dist/*.xpi 2>/dev/null) \
            --title "Password Manager $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
